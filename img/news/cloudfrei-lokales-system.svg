</defs><g font-family="Arial,Helvetica,sans-serif"><text x="500" y="45" text-anchor="middle" font-size="32" fill="#284951" font-weight="700">Deine Daten bleiben bei dir.</text><text x="500" y="81" text-anchor="middle" font-size="22" fill="#506875" font-weight="500">Verarbeiten · Speichern · Steuern</text><circle cx="500" cy="330" r="210" fill="url(#dots)"/><path d="M265 205H335V335H455M735 205H665V335H545M265 455H335V335M735 455H665V335" fill="none" stroke="#088178" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><use href="#house" transform="translate(500 330) scale(1)"/><use href="#one" transform="translate(500 335) scale(1.05)"/><text x="500" y="405" text-anchor="middle" font-size="23" fill="#284951" font-weight="700">eHive One</text><use href="#pv" transform="translate(230 205) scale(1.15)"/><text x="230" y="283" text-anchor="middle" font-size="24" fill="#284951" font-weight="700">PV &amp; Speicher</text><text x="230" y="313" text-anchor="middle" font-size="19" fill="#506875" font-weight="500">lokal angebunden</text><use href="#wallbox" transform="translate(770 205) scale(1.15)"/><text x="770" y="283" text-anchor="middle" font-size="24" fill="#284951" font-weight="700">Wallbox</text><text x="770" y="313" text-anchor="middle" font-size="19" fill="#506875" font-weight="500">lokal laden</text><use href="#meter" transform="translate(230 455) scale(1.15)"/><text x="230" y="533" text-anchor="middle" font-size="24" fill="#284951" font-weight="700">Zähler &amp; Geräte</text><text x="230" y="563" text-anchor="middle" font-size="19" fill="#506875" font-weight="500">lokale Messwerte</text><use href="#browser" transform="translate(770 455) scale(1.15)"/><text x="770" y="533" text-anchor="middle" font-size="24" fill="#284951" font-weight="700">Dein Browser</text><text x="770" y="563" text-anchor="middle" font-size="19" fill="#506875" font-weight="500">Bedienung im Heimnetz</text><text x="500" y="604" text-anchor="middle" font-size="22" fill="#088178" font-weight="500">Lokale Datenwege – ohne eHive-Cloudserver</text></g></svg>
