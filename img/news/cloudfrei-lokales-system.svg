<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 620" role="img" aria-labelledby="title desc"><title id="title">Verarbeitung im eigenen Heimnetz</title><desc id="desc">Lokal angebundene PV, Speicher, Wallbox und Zähler kommunizieren mit eHive One. Die Bedienung erfolgt im Browser im Heimnetz.</desc><g font-family="system-ui, -apple-system, sans-serif"><rect width="1000" height="620" rx="24" fill="#f2f8f8"/><text x="45" y="58" font-size="34" fill="#182d38" font-weight="750" text-anchor="start">Deine Daten bleiben bei dir.</text><text x="45" y="94" font-size="23" fill="#48616a" font-weight="500" text-anchor="start">Kommunikation und Verarbeitung in deinem Heimnetz</text><rect x="35" y="125" width="930" height="445" rx="18" fill="#e4f1ef" stroke="#96c9c2" stroke-width="2"/><text x="65" y="165" font-size="20" fill="#146c63" font-weight="700" text-anchor="start">DEIN ZUHAUSE</text><path d="M250 265 L410 345" stroke="#147d74" stroke-width="4" fill="none"/><path d="M750 265 L590 345" stroke="#147d74" stroke-width="4" fill="none"/><path d="M250 455 L410 345" stroke="#147d74" stroke-width="4" fill="none"/><path d="M750 455 L590 345" stroke="#147d74" stroke-width="4" fill="none"/><rect x="350" y="275" width="300" height="150" rx="18" fill="#143b43" stroke="#143b43" stroke-width="2"/><text x="500" y="324" font-size="31" fill="#fff" font-weight="750" text-anchor="middle">eHive One</text><text x="500" y="361" font-size="22" fill="#d4eeea" font-weight="500" text-anchor="middle">Steuern · Speichern</text><text x="500" y="393" font-size="22" fill="#d4eeea" font-weight="500" text-anchor="middle">Lokal auswerten</text><rect x="65" y="205" width="260" height="100" rx="18" fill="#fff" stroke="#c7d9dd" stroke-width="2"/><text x="195" y="245" font-size="24" fill="#182d38" font-weight="700" text-anchor="middle">PV &amp; Speicher</text><text x="195" y="279" font-size="19" fill="#48616a" font-weight="500" text-anchor="middle">Lokale Schnittstelle</text><rect x="675" y="205" width="260" height="100" rx="18" fill="#fff" stroke="#c7d9dd" stroke-width="2"/><text x="805" y="245" font-size="24" fill="#182d38" font-weight="700" text-anchor="middle">Wallbox</text><text x="805" y="279" font-size="19" fill="#48616a" font-weight="500" text-anchor="middle">Lokal angebunden</text><rect x="65" y="415" width="260" height="100" rx="18" fill="#fff" stroke="#c7d9dd" stroke-width="2"/><text x="195" y="455" font-size="24" fill="#182d38" font-weight="700" text-anchor="middle">Zähler &amp; Geräte</text><text x="195" y="489" font-size="19" fill="#48616a" font-weight="500" text-anchor="middle">Lokale Messwerte</text><rect x="675" y="415" width="260" height="100" rx="18" fill="#fff" stroke="#c7d9dd" stroke-width="2"/><text x="805" y="455" font-size="24" fill="#182d38" font-weight="700" text-anchor="middle">Dein Browser</text><text x="805" y="489" font-size="19" fill="#48616a" font-weight="500" text-anchor="middle">Bedienung im Heimnetz</text><text x="500" y="603" font-size="23" fill="#182d38" font-weight="500" text-anchor="middle">Kein eHive-Cloudserver für den lokalen Betrieb nötig.</text></g></svg>