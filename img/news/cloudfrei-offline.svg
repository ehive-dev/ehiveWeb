<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 620" role="img" aria-labelledby="title desc"><title id="title">Lokale Funktionen und Internetdienste</title><desc id="desc">Ohne Internet bleiben lokale Steuerung, Datenhaltung und Browserbedienung nutzbar. Livepreise, Wetterdaten, Onlineupdates, Fernzugriff und reine Cloudschnittstellen benötigen Internet.</desc><g font-family="system-ui, -apple-system, sans-serif"><rect width="1000" height="620" rx="24" fill="#f2f8f8"/><text x="45" y="58" font-size="34" fill="#182d38" font-weight="750" text-anchor="start">Internet aus. Lokal geht es weiter.</text><text x="45" y="96" font-size="22" fill="#48616a" font-weight="500" text-anchor="start">Entscheidend sind lokale Schnittstellen und deine Konfiguration.</text><rect x="40" y="135" width="920" height="250" rx="18" fill="#e4f1ef" stroke="#96c9c2" stroke-width="2"/><text x="70" y="181" font-size="23" fill="#146c63" font-weight="750" text-anchor="start">IM HEIMNETZ WEITER NUTZBAR</text><circle cx="82" cy="227" r="7" fill="#147d74"/><text x="105" y="235" font-size="27" fill="#182d38" font-weight="500" text-anchor="start">Geräte lokal steuern</text><circle cx="82" cy="274" r="7" fill="#147d74"/><text x="105" y="282" font-size="27" fill="#182d38" font-weight="500" text-anchor="start">Lokale Daten speichern und auswerten</text><circle cx="82" cy="321" r="7" fill="#147d74"/><text x="105" y="329" font-size="27" fill="#182d38" font-weight="500" text-anchor="start">Oberfläche im Browser bedienen</text><rect x="40" y="410" width="920" height="165" rx="18" fill="#fff" stroke="#c7d9dd" stroke-width="2"/><text x="70" y="456" font-size="23" fill="#48616a" font-weight="750" text-anchor="start">BRAUCHT EINE INTERNETVERBINDUNG</text><text x="70" y="502" font-size="25" fill="#182d38" font-weight="500" text-anchor="start">Live-Strompreise · Wetterdaten · Online-Updates</text><text x="70" y="542" font-size="24" fill="#182d38" font-weight="500" text-anchor="start">Fernzugriff · reine Cloud-Schnittstellen anderer Hersteller</text></g></svg>