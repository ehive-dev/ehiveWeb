<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 620" role="img" aria-labelledby="title desc"><title id="title">Lokale Funktionen bleiben ohne Internet aktiv</title><desc id="desc">Wallbox, Zähler und Browser bleiben im Heimnetz nutzbar. Eine durchgestrichene Internetwolke zeigt den Offlinezustand. Livepreise, Wetter, Onlineupdates, Fernzugriff und Cloudschnittstellen brauchen Internet.</desc><defs>
<pattern id="dots" width="22" height="22" patternUnits="userSpaceOnUse"><circle cx="1" cy="1" r=".8" fill="#dce5e8"/></pattern>
<g id="one"><rect x="-29" y="-45" width="58" height="90" rx="5" fill="#303432"/><rect x="-26" y="-38" width="52" height="76" rx="2" fill="#4b4e4c"/><path d="M-24-40H24M-24 40H24" stroke="#737b76"/><text y="6" text-anchor="middle" font-size="18" fill="#f3f5f0">One</text></g>
<g id="meter"><rect x="-27" y="-35" width="54" height="70" rx="7" fill="#fff" stroke="#9fb7bb" stroke-width="2"/><path d="M-16-35v-5h32v5M-16 35v5h32v-5" fill="#e1eceb" stroke="#9fb7bb"/><rect x="-18" y="-23" width="36" height="20" rx="3" fill="#e8f4f1"/><text y="-10" font-size="8" text-anchor="middle" fill="#35666a" font-family="monospace">01248</text><circle cx="-12" cy="11" r="3" fill="#088178"/><path d="M-3 10H17M-17 25H17" stroke="#d4e3e2" stroke-width="2"/></g>
<g id="wallbox"><rect x="-30" y="-36" width="60" height="72" rx="12" fill="#284951"/><rect x="-18" y="-25" width="36" height="14" rx="3" fill="#c9e5df"/><path d="M2-1l-10 16H3L-4 28" fill="none" stroke="#93d6c7" stroke-width="3"/><path d="M30-4q23 0 16 25t11 12" fill="none" stroke="#5b7a80" stroke-width="3"/></g>
<g id="pv"><path d="M-38-30H38L49 28H-49Z" fill="#344f61" stroke="#8eafb9" stroke-width="2"/><path d="M-19-30l-5 58M0-30V28M19-30l5 58M-42-11H42M-46 9H46" stroke="#87aaba" stroke-width="1.5"/><path d="M0 28V42M-23 42H23" stroke="#8eafb9" stroke-width="3"/></g>
<g id="browser"><rect x="-49" y="-34" width="98" height="64" rx="5" fill="#fff" stroke="#9fb7bb" stroke-width="2"/><path d="M-49-20H49M-15 42H15M0 30V42" stroke="#9fb7bb" stroke-width="2"/><circle cx="-38" cy="-27" r="2" fill="#088178"/><path d="M-32 15l20-13 17 7 25-17" fill="none" stroke="#088178" stroke-width="3"/></g>
<g id="phone"><rect x="-24" y="-43" width="48" height="86" rx="8" fill="#fff" stroke="#9fb7bb" stroke-width="2.5"/><path d="M-10-34H10M-7 34H7" stroke="#9fb7bb" stroke-width="2"/><path d="M-9 0l7 7 14-17" fill="none" stroke="#088178" stroke-width="3"/></g>
<g id="shield"><path d="M0-48l41 16V0q0 29-41 51Q-41 29-41 0V-32Z" fill="#e8f4f1" stroke="#088178" stroke-width="2.5"/><rect x="-17" y="-6" width="34" height="29" rx="5" fill="#088178"/><path d="M-10-6V-17a10 10 0 0 1 20 0V-6" fill="none" stroke="#088178" stroke-width="4"/><circle cy="5" r="3" fill="#fff"/><path d="M0 7V13" stroke="#fff" stroke-width="2"/></g>
<g id="cloud"><path d="M-30 20h60a20 20 0 0 0 0-40 30 30 0 0 0-56-7 24 24 0 0 0-4 47Z" fill="#eef3f4" stroke="#9fb7bb" stroke-width="2.5"/></g>
<g id="house"><path d="M-120-38L0-130 120-38" fill="#e8f2f2" stroke="#a9bac2" stroke-width="2.5" stroke-linejoin="round"/><path d="M-104-48V115H104V-48" fill="#fff" stroke="#a9bac2" stroke-width="2"/><path d="M-104 115H104" stroke="#a9bac2" stroke-width="2"/></g>
<g id="storage"><path d="M-30-22V24c0 15 60 15 60 0V-22" fill="#e8f4f1" stroke="#9fb7bb" stroke-width="2"/><ellipse cy="-22" rx="30" ry="11" fill="#fff" stroke="#9fb7bb" stroke-width="2"/><path d="M-30-7c0 15 60 15 60 0M-30 9c0 15 60 15 60 0" fill="none" stroke="#9fb7bb" stroke-width="2"/></g></defs><g font-family="Arial,Helvetica,sans-serif"><text x="500" y="45" text-anchor="middle" font-size="32" fill="#284951" font-weight="700">Offline? Dein Zuhause bleibt aktiv.</text><text x="500" y="81" text-anchor="middle" font-size="21" fill="#506875" font-weight="500">Mit lokal angebundenen Geräten und passender Konfiguration</text><ellipse cx="355" cy="310" rx="270" ry="185" fill="url(#dots)"/><use href="#house" transform="translate(350 310) scale(1)"/><path d="M175 220H220V315H321M175 430H220V315M379 315H475V325H516" fill="none" stroke="#088178" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><use href="#one" transform="translate(350 315) scale(1)"/><text x="350" y="385" text-anchor="middle" font-size="22" fill="#284951" font-weight="700">eHive One</text><use href="#wallbox" transform="translate(145 220) scale(1)"/><use href="#storage" transform="translate(145 430) scale(1)"/><use href="#browser" transform="translate(565 325) scale(1)"/><text x="145" y="286" text-anchor="middle" font-size="22" fill="#088178" font-weight="500">Steuern</text><text x="145" y="498" text-anchor="middle" font-size="22" fill="#088178" font-weight="500">Speichern</text><text x="565" y="397" text-anchor="middle" font-size="22" fill="#088178" font-weight="500">Bedienen</text><use href="#cloud" transform="translate(820 190) scale(1.15)"/><path d="M781 145l78 77" stroke="#9a685e" stroke-width="4" stroke-linecap="round"/><text x="820" y="263" text-anchor="middle" font-size="24" fill="#284951" font-weight="700">Internet aus</text><text x="820" y="322" text-anchor="middle" font-size="20" fill="#506875" font-weight="500">Benötigt Internet:</text><text x="820" y="361" text-anchor="middle" font-size="20" fill="#506875" font-weight="500">Livepreise &amp; Wetter</text><text x="820" y="397" text-anchor="middle" font-size="20" fill="#506875" font-weight="500">Online-Updates</text><text x="820" y="433" text-anchor="middle" font-size="20" fill="#506875" font-weight="500">Fernzugriff</text><text x="820" y="469" text-anchor="middle" font-size="20" fill="#506875" font-weight="500">Cloud-Schnittstellen</text><text x="500" y="580" text-anchor="middle" font-size="26" fill="#088178" font-weight="700">Lokale Funktionen bleiben nutzbar.</text></g></svg>
