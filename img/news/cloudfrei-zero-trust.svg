<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 620" role="img" aria-labelledby="title desc"><title id="title">Zero Trust beim optionalen Fernzugriff</title><desc id="desc">Zugriff von unterwegs erfolgt über einen geschützten Zugang, der die Berechtigung prüft. Erreichbar sind nur freigegebene Oberflächen. Die verschlüsselte Verbindung wird vom Gerät nach außen aufgebaut.</desc><g font-family="system-ui, -apple-system, sans-serif"><rect width="1000" height="620" rx="24" fill="#f2f8f8"/><text x="45" y="58" font-size="32" fill="#182d38" font-weight="750" text-anchor="start">Zero Trust: Zugriff braucht Berechtigung.</text><text x="45" y="96" font-size="22" fill="#48616a" font-weight="500" text-anchor="start">Optionaler Fernzugriff auf gezielt freigegebene Oberflächen</text><rect x="80" y="135" width="840" height="112" rx="18" fill="#fff" stroke="#c7d9dd" stroke-width="2"/><text x="500" y="178" font-size="27" fill="#182d38" font-weight="700" text-anchor="middle">Du möchtest von unterwegs zugreifen</text><text x="500" y="215" font-size="22" fill="#48616a" font-weight="500" text-anchor="middle">Der Fernzugriff wird bewusst eingerichtet.</text><path d="M500 247 L500 285" stroke="#147d74" stroke-width="4" fill="none"/><rect x="80" y="285" width="840" height="112" rx="18" fill="#143b43" stroke="#143b43" stroke-width="2"/><text x="500" y="328" font-size="27" fill="#fff" font-weight="700" text-anchor="middle">Geschützter Zugang prüft die Berechtigung</text><text x="500" y="365" font-size="22" fill="#d4eeea" font-weight="500" text-anchor="middle">Eine bekannte Adresse allein reicht nicht.</text><path d="M500 397 L500 435" stroke="#147d74" stroke-width="4" fill="none"/><rect x="80" y="435" width="840" height="112" rx="18" fill="#fff" stroke="#c7d9dd" stroke-width="2"/><text x="500" y="478" font-size="27" fill="#182d38" font-weight="700" text-anchor="middle">Nur die vorgesehene Oberfläche wird erreichbar</text><text x="500" y="515" font-size="22" fill="#48616a" font-weight="500" text-anchor="middle">Keine allgemeine Portfreigabe am Router nötig.</text><text x="500" y="598" font-size="22" fill="#182d38" font-weight="500" text-anchor="middle">Verschlüsselter Tunnel: eHive One baut die Verbindung nach außen auf.</text></g></svg>