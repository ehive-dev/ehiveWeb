<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="description" content="Kontakt und Support." />
  <title>eHive One Shop • Kontakt</title>
  <link rel="icon" href="img/favicon.svg" type="image/svg+xml" />
  <link rel="stylesheet" href="style.css" />
</head>
<body>

<div data-include="header"></div>

<main>

<section class="section">
  <div class="container">
    <div class="section-title">
      <h2>Kontakt</h2>
      <p>Platzhalter-Kontaktseite. Für GitHub Pages kannst du z.B. ein externes Formular nutzen.</p>
    </div>

    <div class="card" style="padding:18px">
      <p class="note">
        E-Mail: <span id="footerEmail">sales@example.com</span>
      </p>

      <p style="color:var(--muted)">
        Tipp: Für ein Kontaktformular ohne Backend kannst du z.B. Formspree, Getform oder Netlify Forms (wenn du bei Netlify hostest) verwenden.
      </p>

      <a class="btn" href="shop.html">Zum Shop</a>
    </div>
  </div>
</section>

</main>

<div data-include="footer"></div>

<script src="config.js"></script>
<script src="script.js"></script>

</body>
</html>
